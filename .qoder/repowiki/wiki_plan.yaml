version: 1

scope:
  include:
    - "src/**"
    - "API/src/**"
    - "API/prisma/schema.prisma"
    - "src/i18n/**"
  exclude:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/generated/**"
    - "**/migrations/**"
    - "**/*.spec.ts"
    - "**/AI-INSTRUCTIONS.ts"

repowiki:
  template: "architecture"

  notes:
    - text: "Windlog é um sistema web de gestão para técnicos de energia eólica. Monorepo com frontend React (Vite) e backend NestJS, comunicando via REST API."
    - text: "O idioma oficial do código é inglês (variáveis, funções, classes). Comentários e documentação são em português brasileiro (PT-BR), estilo didático e explicativo."
    - text: "Autenticação via JWT Bearer Token. O payload JWT contém { sub: userId, email, role }. O campo sub é o ID do usuário — nunca usar user.id."
    - text: "O sistema usa RBAC com 3 roles: ADMIN (acesso total), HR (gestão de pessoas), STANDARD (acesso restrito). Roles são definidos no decorator @Roles() e validados pelo RolesGuard."
    - text: "Todas as entidades principais usam UUID como ID e soft delete (campo deletedAt). Timestamps sempre em UTC."
    - text: "Formato de resposta padronizado: sucesso = { data, message, statusCode, timestamp }, erro = { error, message, statusCode, timestamp, path }."
    - text: "Moeda oficial da aplicação é Euro (€). Locale padrão é pt-PT para formatação de datas e números."
    - text: "Design system inspirado na Apple: minimalista, limpo, espaçamento generoso, cores neutras com acentos em azul. Tailwind CSS v4 com classes utilitárias."
    - text: "Frontend usa TanStack Query (React Query) para data fetching e cache. Mutações devem invalidar queries relacionadas via queryClient.invalidateQueries()."
    - text: "i18n obrigatório em todo texto visível ao usuário. Namespace 'common' para textos compartilhados. Nunca usar strings hardcoded em inglês na UI."
    - text: "Logging completo via LoggingInterceptor + SystemLogService. Toda ação do usuário deve ser registrada com contexto completo (userId, action, entity, IP, duration)."
    - text: "Upload de ficheiros via Multer com validação de MIME type e tamanho. URLs temporárias para acesso seguro a ficheiros (endpoint /upload/files/:token)."

