knowledgecard:
  notes:
    - text: "Todo módulo backend segue exatamente: {name}.module.ts + {name}.controller.ts + {name}.service.ts + dto/{name}.dto.ts. Nunca adicionar lógica no controller — pertence ao service."
    - text: "DTOs backend usam class-validator com decorators @IsString, @IsEmail, @IsOptional, etc. Todo campo opcional PRECISA de @IsOptional() — o ? do TypeScript não é suficiente."
    - text: "Frontend pages seguem padrão: {PageName}.tsx + components/ + hooks/. Services ficam em src/services/ e encapsulam chamadas à API via axios."
    - text: "TanStack Query keys seguem padrão ['entity', filter?] para listas e ['entity', id] para detalhes. Mutações invalidam todas as keys relacionadas."
    - text: "Componentes UI ficam em src/components/ui/. Componentes de layout em src/components/layout/. Nunca misturar — UI são genéricos, layout são estruturais."
    - text: "Toast notifications obrigatórias para todas operações CRUD via Sonner. Mensagens em português. Padrão: 'X criado/atualizado/removido com sucesso'."
    - text: "Prisma é a única fonte de tipos autoritativa. Enums no código devem espelhar enums do schema.prisma. Nunca acessar o banco fora do Service."
    - text: "Design responsivo obrigatório: mobile-first com breakpoints Tailwind (sm:, md:, lg:). Sidebar colapsável em mobile via hamburger menu."
    - text: "Soft delete obrigatório para entidades de negócio (User, Project, Turbine, File). Sempre filtrar deletedAt: null nas queries. Junction tables podem usar hard delete."
    - text: "LoggingInterceptor mapeia automaticamente URL + método HTTP para LogAction. Novos endpoints devem ter seu LogAction adicionado ao método determineAction()."
