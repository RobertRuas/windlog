# ============================================================================
# DOCKER COMPOSE - Windlog (Produção - Servidor windlog.org)
# ============================================================================
#
# COMO USAR:
# ----------
# docker compose up -d --build       # Build e start em background
# docker compose down                # Parar e remover containers
# docker compose logs -f             # Ver logs em tempo real
#
# ARQUITETURA:
# ------------
# Internet → Cloudflare (SSL) → Tunnel → Traefik → Container (Nginx :80)
#                                                    ├── Frontend estático
#                                                    └── Proxy /api → NestJS :3000
#
# BANCO DE DADOS:
# ---------------
# PostgreSQL externo: database.windlog.org:5432
# (Não roda localmente — usa o servidor central)
#
# ACESSO:
# -------
# Frontend:  https://app.windlog.org
# API:       https://app.windlog.org/api/v1
# Swagger:   https://app.windlog.org/api/docs (apenas em dev)
#
# UTILIZADORES (senha: 123456):
# -----------------------------
# admin@windlog.com   → ADMIN
# rh@windlog.com      → HR
# default@windlog.com → STANDARD
# ============================================================================

services:
  # ── Aplicação (Nginx + NestJS em um container) ─────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windlog-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://admin:windlog2024@postgres:5432/windlog
      - PORT=3000
      - LISTEN_HOST=127.0.0.1
      - JWT_SECRET=change-this-to-a-long-random-string-in-production
      - JWT_EXPIRES_IN=2h
      - JWT_REFRESH_EXPIRES_IN=30d
      - CORS_ORIGIN=https://app.windlog.org
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE=10485760
      - FILE_TOKEN_TTL=300
    volumes:
      - uploads_data:/app/uploads
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.windlog-app.rule=Host(`app.windlog.org`)"
      - "traefik.http.routers.windlog-app.entrypoints=web"
      - "traefik.http.services.windlog-app.loadbalancer.server.port=80"

networks:
  proxy-net:
    external: true

volumes:
  uploads_data:
