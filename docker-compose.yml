# ============================================================================
# DOCKER COMPOSE - Windlog App (Produção - Servidor windlog.org)
# ============================================================================
#
# ARQUITETURA:
# ------------
# Internet → Cloudflare (SSL) → Tunnel → Traefik → Container (Nginx :80)
#                                                    ├── Frontend estático
#                                                    └── Proxy /api → NestJS :3000
#
# BANCO DE DADOS:
# ---------------
# PostgreSQL centralizado: container "windlog-db" (hostname: "database")
# Gerido separadamente em /opt/windlog/docker-compose.yml
# Partilhado por TODAS as aplicações do servidor.
#
# ACESSO:
# -------
# Frontend:  https://app.windlog.org
# API:       https://app.windlog.org/api/v1
# Swagger:   https://app.windlog.org/api/docs (apenas em dev)
#
# UTILIZADORES (senha: 123456):
# -----------------------------
# admin@windlog.com   → ADMIN
# rh@windlog.com      → HR
# default@windlog.com → STANDARD
# ============================================================================

services:
  # ── Aplicação (Nginx + NestJS em um container) ─────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windlog-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://windlog:windlog_pass@database:5432/windlog
      - PORT=3000
      - LISTEN_HOST=127.0.0.1
      - JWT_SECRET=change-this-to-a-long-random-string-in-production
      - JWT_EXPIRES_IN=2h
      - JWT_REFRESH_EXPIRES_IN=30d
      - CORS_ORIGIN=https://app.windlog.org
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE=10485760
      - FILE_TOKEN_TTL=300
    volumes:
      - uploads_data:/app/uploads
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.windlog-app.rule=Host(`app.windlog.org`)"
      - "traefik.http.routers.windlog-app.entrypoints=web"
      - "traefik.http.services.windlog-app.loadbalancer.server.port=80"
      - "autoheal=true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost/api/v1/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  proxy-net:
    external: true

volumes:
  uploads_data:
