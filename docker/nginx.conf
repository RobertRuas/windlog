# ============================================================================
# NGINX CONFIGURATION - Windlog
# ============================================================================
#
# Serve o frontend estático (Vite build) na raiz /
# Faz proxy reverso de /api para o NestJS API (localhost:3000)
# Gere SPA routing: fallback para index.html (React Router)
# ============================================================================

server {
    listen 80;
    server_name _;

    # ── Frontend estático ──────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para reduzir tamanho das respostas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Cache para assets estáticos (ficheiros com hash no nome)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API: proxy reverso para NestJS ─────────────────────────────────
    # Todas as rotas /api são redirecionadas para o backend na porta 3000
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Limites para upload de ficheiros
        client_max_body_size 10m;
    }

    # ── SPA Fallback ───────────────────────────────────────────────────
    # React Router: qualquer rota que não seja /api ou asset estático
    # retorna o index.html para o router gerir no cliente
    location / {
        try_files $uri $uri/ /index.html;
    }
}
